name: Docker

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  docker:
    name: Docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Install Just
        uses: extractions/setup-just@v4
        with:
          just-version: '1.59.0'

      - name: Build Docker images
        run: just docker-build
